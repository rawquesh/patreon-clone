name: patreon_clone
description: "Patreon Clone Mobile App"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0+110

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^6.3.0
  responsive_builder: ^0.7.1
  loading_animation_widget: ^1.3.0
  fluttertoast: ^8.2.12
  image_picker: ^1.1.2
  flutter_html: ^3.0.0-alpha.6
  socket_io_client: ^3.1.2
  youtube_player_flutter: ^9.1.1
  flashy_tab_bar2: ^0.0.10
  flutter_animate: ^4.5.2
  webview_flutter: ^4.13.0
  sidebarx: ^0.17.1
  html_editor_enhanced: ^2.7.0
  file_picker: ^9.2.3
  any_link_preview: ^3.0.3
  share_plus: ^11.0.0
  font_awesome_flutter: ^10.8.0
  url_launcher: ^6.3.1
  html_unescape: ^2.0.0
  fl_chart: ^1.0.0
  csv: ^6.0.0
  permission_handler: ^12.0.1
  just_audio: ^0.10.4
  cupertino_icons: ^1.0.8
  firebase_messaging: ^16.0.0
  firebase_core: ^4.0.0
  audio_session: ^0.2.2
  flutter_local_notifications: ^19.4.0
  http: ^1.2.0
  http_parser: ^4.0.2
  country_picker: ^2.0.27
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.4.0
  app_links: ^6.4.1
  cached_video_player_plus: ^4.0.4
  chewie: ^1.13.0
  youtube_explode_dart: ^3.0.5
  video_thumbnail: ^0.5.6
  crypto: ^3.0.7
  video_compress: ^3.1.4
  video_trimmer: ^5.0.0

  # Dependencies merged from patreon-clone_models
  encrypt: ^5.0.3
  intl: ^0.20.1
  shared_preferences: ^2.3.5
  uuid: ^4.4.0
  path_provider: ^2.1.5
  overlay_support: ^2.1.0
  provider: ^6.1.2
  hive: ^2.2.3
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  mime: any
  path: any
  video_player: any
  go_router: ^17.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/patreon-clone_logo.png"
  adaptive_icon_foreground: "assets/images/patreon-clone_logo.png"
  adaptive_icon_background: "#FFFFFF" # <-- ADD THIS (replace with your color)

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: TestTiemposHeadline
      fonts:
        - asset: assets/fonts/TestTiemposHeadline-Regular.otf
        - asset: assets/fonts/TestTiemposHeadline-RegularItalic.otf
          style: italic
        - asset: assets/fonts/TestTiemposHeadline-Light.otf
          weight: 300
        - asset: assets/fonts/TestTiemposHeadline-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/TestTiemposHeadline-Medium.otf
          weight: 500
        - asset: assets/fonts/TestTiemposHeadline-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/TestTiemposHeadline-Semibold.otf
          weight: 600
        - asset: assets/fonts/TestTiemposHeadline-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/TestTiemposHeadline-Bold.otf
          weight: 700
        - asset: assets/fonts/TestTiemposHeadline-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/TestTiemposHeadline-Black.otf
          weight: 900
        - asset: assets/fonts/TestTiemposHeadline-BlackItalic.otf
          weight: 900
          style: italic
