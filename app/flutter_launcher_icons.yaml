# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/patreon-clone_logo.png"

  android: "launcher_icon"
  image_path_android: "assets/images/patreon-clone_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/patreon-clone_logo.png"
  adaptive_icon_foreground_inset: 16

  # adaptive_icon_monochrome: "assets/icon/monochrome.png"

  ios: true
  image_path_ios: "assets/images/patreon-clone_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

  web:
    generate: false
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

  windows:
    generate: false
    image_path: "path/to/image.png"
    icon_size: 48 # min:48, max:256, default: 48

  macos:
    generate: false
    image_path: "path/to/image.png"
